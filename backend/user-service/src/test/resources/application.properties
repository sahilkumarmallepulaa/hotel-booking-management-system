# Test Application Configuration
spring.application.name=USER-SERVICE-TEST
server.port=0

# H2 In-Memory Database for automated tests
spring.datasource.url=jdbc:h2:mem:user_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Eureka Registration in tests
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# JWT Secret for Unit / Integration Tests (at least 256 bits)
jwt.secret=TestSecretKeyForUnitAndIntegrationTestsWithMinimum256BitsLength1234567890
jwt.expiration-ms=86400000
